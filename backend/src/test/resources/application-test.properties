# Test profile configuration
# This file ensures tests ALWAYS use H2, even when environment variables are set

# H2 Database Configuration (in-memory)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Disable Flyway for tests
spring.flyway.enabled=false

app.billing.paymentsEnabled=true

# Test Stripe Configuration
app.stripe.pricePackSize=20
app.stripe.priceUsd=1.98
app.stripe.webhookSecret=test_webhook_secret
app.stripe.publishableKey=pk_test_xxx
app.stripe.secretKey=sk_test_xxx

# Test Auth Configuration
app.auth.googleClientId=test_client_id.apps.googleusercontent.com
app.auth.allowedOrigins=http://localhost:3000

# Logging
logging.level.com.raimonvibe.imageconverter=DEBUG
logging.level.org.springframework.security=DEBUG
