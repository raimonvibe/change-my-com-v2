server:
  port: ${PORT:8080}
  tomcat:
    max-swallow-size: 20MB
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/imageconverter}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate  # Only validate schema, don't modify in production
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  mvc:
    async:
      request-timeout: 30s
  flyway:
    baseline-on-migrate: true
    baseline-version: 0

app:
  stripe:
    pricePackSize: 20
    priceUsd: 1.98
    webhookSecret: ${STRIPE_WEBHOOK_SECRET:}
    publishableKey: ${STRIPE_PUBLISHABLE_KEY:}
    secretKey: ${STRIPE_SECRET_KEY:}
  auth:
    googleClientId: ${GOOGLE_CLIENT_ID:}
    allowedOrigins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

logging:
  level:
    com.raimonvibe.imageconverter: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/application.log
    max-size: 10MB
    max-history: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  security:
    enabled: true

# Production security settings (merged into server section above)
