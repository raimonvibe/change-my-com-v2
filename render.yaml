# Render Blueprint Configuration
# This file allows you to deploy your entire stack with one click

services:
  # PostgreSQL Database
  - type: pserv
    name: imageconverter-db
    env: postgresql
    plan: free
    databaseName: imageconverter
    databaseUser: imageconverter_user

  # Backend Spring Boot Service
  - type: web
    name: imageconverter-backend
    env: java
    plan: free
    buildCommand: cd backend && ./mvnw clean package -DskipTests
    startCommand: cd backend && java -jar target/change-my-image-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: imageconverter-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: imageconverter-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: imageconverter-db
          property: password
      - key: STRIPE_SECRET_KEY
        sync: false  # Set this manually in Render dashboard
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false  # Set this manually in Render dashboard
      - key: STRIPE_WEBHOOK_SECRET
        sync: false  # Set this manually in Render dashboard
      - key: GOOGLE_CLIENT_ID
        sync: false  # Set this manually in Render dashboard
      - key: ALLOWED_ORIGINS
        value: https://imageconverter-frontend.onrender.com

  # Frontend Next.js Static Site
  - type: web
    name: imageconverter-frontend
    env: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/out
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: imageconverter-backend
          property: host
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false  # Set this manually in Render dashboard
      - key: NEXTAUTH_URL
        fromService:
          type: web
          name: imageconverter-frontend
          property: host
      - key: NEXTAUTH_SECRET
        sync: false  # Set this manually in Render dashboard
      - key: GOOGLE_CLIENT_ID
        sync: false  # Set this manually in Render dashboard
      - key: GOOGLE_CLIENT_SECRET
        sync: false  # Set this manually in Render dashboard
