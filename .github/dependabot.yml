# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend" # De root directory van je frontend
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10 # Voorkomt dat wekelijkse updates geblokkeerd worden door de standaardlimiet van 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # typescript-eslint 8.x peers TypeScript <6.1.0; 6.0.3 is the latest compatible stable.
    ignore:
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
  - package-ecosystem: "maven"
    directory: "/backend" # De root directory van je backend
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10 # Voorkomt dat wekelijkse updates geblokkeerd worden door de standaardlimiet van 5
    groups:
      maven-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
