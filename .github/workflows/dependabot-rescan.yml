# Request fresh Dependabot version-update scans (e.g. after hitting open-PR limit).
# Also runs on push to main when dependency manifests or this workflow change.
name: Dependabot rescan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/dependabot.yml
      - .github/workflows/dependabot-rescan.yml
      - frontend/package.json
      - frontend/package-lock.json
      - backend/pom.xml

permissions:
  contents: read

jobs:
  trigger-version-updates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - ecosystem: npm
            directory: /frontend
          - ecosystem: maven
            directory: /backend
    steps:
      - name: Request Dependabot scan (${{ matrix.ecosystem }})
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_TRIGGER_TOKEN || github.token }}
        run: |
          status=$(curl -sS -o /tmp/dependabot-response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/dependabot/updates" \
            -d "{\"package-ecosystem\":\"${{ matrix.ecosystem }}\",\"directory\":\"${{ matrix.directory }}\"}")
          cat /tmp/dependabot-response.json
          if [ "$status" = "403" ] || [ "$status" = "404" ]; then
            echo "::warning::Dependabot API returned ${status}. Add repo secret DEPENDABOT_TRIGGER_TOKEN (PAT with repo scope) for manual rescans."
            exit 0
          fi
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Dependabot API returned ${status}"
            exit 1
          fi
